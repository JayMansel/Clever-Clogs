<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1433">
<meta name="description" content="Clever Clogs: a family quiz you play together, each on your own phone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clever Clogs">
<title>Clever Clogs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230E1433'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap">
<style>
/* Clever Clogs — Saturday-night telly studio. One committed dark theme. */
:root {
  color-scheme: dark;
  --studio: #0E1433;
  --panel: #161F4D;
  --panel-2: #1D2860;
  --rim: #2F3D86;
  --ink: #070A1E;
  --chalk: #F6F3FF;
  --haze: #A9B2DE;
  --bulb: #FFD35C;
  --bulb-deep: #C28F1B;
  --tomato: #FF5E57;
  --azure: #4AA3FF;
  --mint: #3FE0A2;
  --ticket: #FFE6B3;
  --ticket-ink: #6B2A17;
  --display: "Shrikhand", "Cooper Black", "Futura", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --led: "Doto", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  padding-inline: 16px; padding-block: 0 40px;
  background-color: var(--studio);
  background-image:
    radial-gradient(110% 50% at 50% -10%, rgba(70, 96, 230, 0.36) 0%, rgba(70, 96, 230, 0) 62%),
    radial-gradient(70% 40% at 100% 100%, rgba(180, 121, 255, 0.1), rgba(180, 121, 255, 0) 70%);
  background-attachment: fixed;
  color: var(--chalk);
  font-family: var(--body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--azure); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { max-width: 600px; margin-inline: auto; padding-block: 14px 24px; }
.screen { display: flex; flex-direction: column; gap: 18px; animation: rise 0.28s ease-out both; }
@keyframes rise { from { opacity: 0.01; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- LED digits ---------- */
.led { font-family: var(--body); font-weight: 700; color: var(--bulb); text-shadow: 0 0 12px rgba(255, 211, 92, 0.4); font-variant-numeric: tabular-nums; }
/* the dot-matrix face is kept for the big displays only */
.ticket-code, .code-input, .secs, .ready-num, .num-answer-value, .num-input { font-family: var(--led); font-weight: 900; }

/* ---------- marquee sign ---------- */
.marquee {
  position: relative; margin: 18px 6px 4px; padding: 30px 18px 26px; border-radius: 22px; text-align: center;
  background: linear-gradient(180deg, #1C276B 0%, #121A4A 100%);
  box-shadow: inset 0 0 0 2px #34449E, 0 18px 40px rgba(0, 0, 0, 0.35);
}
.marquee .bulbs { position: absolute; inset: 0; pointer-events: none; }
.marquee .bulbs i {
  position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FFF7DA 0 22%, var(--bulb) 48%, #D39A1F 100%);
  box-shadow: 0 0 10px 2px rgba(255, 211, 92, 0.6);
  animation: chase 1.2s steps(1, end) infinite;
}
@keyframes chase { 0% { opacity: 1; } 66.6% { opacity: 0.2; box-shadow: none; } }
.marquee-eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--haze); }
.logo {
  margin: 10px 0 8px; display: flex; flex-direction: column; align-items: center;
  font-family: var(--display); font-weight: 400; font-size: clamp(56px, 17vw, 94px); line-height: 0.86; letter-spacing: 0.005em;
  color: var(--chalk); transform: rotate(-3deg);
  text-shadow: 3px 3px 0 var(--tomato), 6px 6px 0 #7A1E2B, 9px 11px 18px rgba(0, 0, 0, 0.45);
}
.logo span:last-child { color: var(--bulb); margin-left: 0.55em; }
.marquee-tag { margin: 6px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--bulb); }
.marquee.small { padding: 22px 14px 18px; }
.marquee.small .logo { font-size: clamp(40px, 11vw, 60px); }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 0; border-radius: 16px; padding: 14px 20px; min-height: 52px;
  font-weight: 700; font-size: 18px; line-height: 1.2; cursor: pointer; background: transparent; color: var(--chalk);
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
}
.btn-big { width: 100%; min-height: 60px; font-size: 20px; }
.btn-primary { background: var(--bulb); color: var(--ink); box-shadow: 0 5px 0 var(--bulb-deep), 0 12px 24px rgba(255, 211, 92, 0.16); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--bulb-deep); }
.btn-ghost { box-shadow: inset 0 0 0 2px var(--rim); }
.btn-ghost:active { background: rgba(255, 255, 255, 0.04); }
.btn-quiet { color: var(--haze); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
.btn-danger { background: var(--tomato); color: #fff; box-shadow: 0 5px 0 #A8322D; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: none; }
.actions { display: grid; gap: 12px; }
.link-btn { background: none; border: 0; padding: 4px; color: var(--azure); font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* ---------- home ---------- */
.lede { margin: 0; text-align: center; font-size: 18px; text-wrap: balance; max-width: 34ch; margin-inline: auto; }
.facts { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; color: var(--haze); font-size: 14px; }
.facts strong { color: var(--chalk); }
.card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-radius: 18px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--rim); }
.card-kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--haze); }
.card-title { margin: 2px 0 0; font-weight: 700; }
.card-title .led { font-size: 22px; }
.resume-actions { display: flex; gap: 8px; align-items: center; }
.notice { margin: 0; padding: 12px 14px; border-radius: 14px; background: rgba(255, 194, 61, 0.12); box-shadow: inset 0 0 0 1.5px rgba(255, 194, 61, 0.4); color: #FFE3A0; }
@media (min-width: 560px) { .home .actions { grid-template-columns: 1fr 1fr; } }

/* ---------- setup ---------- */
.back { align-self: flex-start; border: 0; background: none; color: var(--haze); font-size: 16px; padding: 8px 0; cursor: pointer; }
.title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9vw, 42px); line-height: 1.05; text-wrap: balance; }
.sub { margin: -8px 0 0; color: var(--haze); }
.form { display: flex; flex-direction: column; gap: 8px; }
.field-label { margin: 12px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--haze); }
.field-hint { margin: 0; font-size: 14px; color: var(--haze); }
.text-input, .code-input, .num-input {
  width: 100%; border: 2px solid var(--rim); border-radius: 14px; padding: 14px 16px;
  background: var(--panel-2); color: var(--chalk); font-size: 20px;
}
.code-input {
  font-family: var(--led); font-weight: 900; font-size: 42px; line-height: 1.1; letter-spacing: 0.38em; text-align: center; text-transform: uppercase;
  color: var(--bulb); padding: 10px 0 10px 0.38em;
}
.code-input::placeholder, .num-input::placeholder { color: #3D4A94; }
.text-input:focus, .code-input:focus, .num-input:focus { outline: none; border-color: var(--bulb); box-shadow: 0 0 0 4px rgba(255, 211, 92, 0.18); }
.av-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.av-pick {
  aspect-ratio: 1; width: 100%; max-width: 64px; justify-self: center; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
  background: var(--av); font-size: 26px; line-height: 1; display: grid; place-items: center;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18); transition: transform 0.12s, box-shadow 0.12s;
}
.av-pick[aria-checked="true"] { box-shadow: 0 0 0 3px var(--studio), 0 0 0 6px var(--bulb); transform: scale(1.06); }
.form-error { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(255, 94, 87, 0.14); color: #FFBDB8; font-weight: 700; }
.form .btn { margin-top: 14px; }

/* ---------- connecting / ended ---------- */
.connecting, .ended { text-align: center; align-items: center; padding-top: 24px; }
.connecting .sub, .ended .sub { margin: 0; max-width: 34ch; }
.conn-help { margin: 0; max-width: 34ch; color: #FFE3A0; }
.bulb-spinner { position: relative; width: 96px; height: 96px; margin: 24px auto 8px; }
.bulb-spinner i { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--bulb); box-shadow: 0 0 12px rgba(255, 211, 92, 0.7); animation: spin-fade 0.96s linear infinite; }
.bulb-spinner i:nth-child(1) { transform: rotate(0deg) translateY(-38px); animation-delay: 0s; }
.bulb-spinner i:nth-child(2) { transform: rotate(45deg) translateY(-38px); animation-delay: -0.84s; }
.bulb-spinner i:nth-child(3) { transform: rotate(90deg) translateY(-38px); animation-delay: -0.72s; }
.bulb-spinner i:nth-child(4) { transform: rotate(135deg) translateY(-38px); animation-delay: -0.6s; }
.bulb-spinner i:nth-child(5) { transform: rotate(180deg) translateY(-38px); animation-delay: -0.48s; }
.bulb-spinner i:nth-child(6) { transform: rotate(225deg) translateY(-38px); animation-delay: -0.36s; }
.bulb-spinner i:nth-child(7) { transform: rotate(270deg) translateY(-38px); animation-delay: -0.24s; }
.bulb-spinner i:nth-child(8) { transform: rotate(315deg) translateY(-38px); animation-delay: -0.12s; }
@keyframes spin-fade { 0% { opacity: 1; } 100% { opacity: 0.15; } }
.ended .btn { max-width: 420px; }

/* ---------- gantry (top bar in a game) ---------- */
.gantry {
  position: sticky; top: 0; z-index: 5; margin: -14px -16px 0; padding: 10px 16px;
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px;
  background: rgba(14, 20, 51, 0.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(47, 61, 134, 0.8);
}
.code-chip {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0; cursor: pointer;
  padding: 5px 9px 4px; border-radius: 8px; background: var(--ticket); color: var(--ticket-ink); line-height: 1;
}
.code-chip-label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
.code-chip .led { color: var(--ticket-ink); text-shadow: none; font-size: 17px; letter-spacing: 0.12em; }
.g-mid { color: var(--haze); font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-score { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.g-score-label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--haze); }
.g-score .led { font-size: 22px; }
.lamp { position: relative; width: 44px; height: 40px; border: 0; border-radius: 12px; background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.lamp i { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--haze); }
.lamp[data-state="good"] i { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
.lamp[data-state="part"] i { background: #FFC23D; box-shadow: 0 0 8px #FFC23D; }
.lamp[data-state="bad"] i { background: var(--tomato); box-shadow: 0 0 8px var(--tomato); animation: blink 0.8s steps(1) infinite; }
.lamp-dots { font-size: 14px; letter-spacing: 1px; color: var(--chalk); margin-top: 2px; }
.banner { margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: rgba(255, 194, 61, 0.14); box-shadow: inset 0 0 0 1px rgba(255, 194, 61, 0.4); color: #FFE3A0; font-weight: 700; font-size: 15px; }
.banner + .screen { margin-top: 12px; }
.gantry + .banner[hidden] + .screen { margin-top: 16px; }
@keyframes blink { 50% { opacity: 0.25; } }

/* ---------- panels ---------- */
.panel { padding: 16px; border-radius: 18px; background: var(--panel); box-shadow: inset 0 0 0 1.5px rgba(47, 61, 134, 0.85); }
.section-label { margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--haze); }
.count { min-width: 1.8em; padding: 1px 7px; border-radius: 99px; background: var(--panel-2); color: var(--chalk); letter-spacing: 0; text-align: center; }

/* ---------- lobby: the ticket ---------- */
.ticket {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; margin: 4px 4px 0;
  background: var(--ticket); color: var(--ticket-ink); border-radius: 16px; transform: rotate(-1deg);
  filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.35));
  -webkit-mask: radial-gradient(circle 13px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 13px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 13px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 13px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
}
.ticket-main { display: flex; flex-direction: column; gap: 2px; padding: 16px 10px 16px 28px; min-width: 0; }
.ticket-label { font-size: 12px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.ticket-code { font-family: var(--led); font-weight: 900; font-size: clamp(44px, 13.5vw, 64px); line-height: 1; letter-spacing: 0.12em; }
.ticket-small { font-size: 13px; opacity: 0.75; }
.ticket-side { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 14px 26px 14px 14px; border-left: 2px dashed rgba(107, 42, 23, 0.35); }
.ticket-btn { border: 0; border-radius: 10px; padding: 10px 12px; min-height: 44px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--ticket-ink); color: var(--ticket); white-space: nowrap; }
.ticket-btn + .ticket-btn { background: transparent; color: var(--ticket-ink); box-shadow: inset 0 0 0 2px rgba(107, 42, 23, 0.4); }

/* ---------- players ---------- */
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.player { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.035); animation: popin 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
.player.away { opacity: 0.55; }
@keyframes popin { from { transform: scale(0.9); opacity: 0.01; } to { transform: none; opacity: 1; } }
.av { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--av); display: grid; place-items: center; font-size: 22px; line-height: 1; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
.av.mini { width: 28px; height: 28px; font-size: 16px; }
.av.big { width: 64px; height: 64px; font-size: 36px; }
.pname { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.tag { flex: none; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; background: rgba(255, 211, 92, 0.16); color: var(--bulb); }
.tag.you { background: rgba(74, 163, 255, 0.18); color: #A9D2FF; }
.away-note { font-size: 13px; color: var(--haze); }
.kick { flex: none; border: 0; border-radius: 10px; padding: 6px 10px; min-height: 36px; font-size: 13px; font-weight: 700; color: var(--haze); background: transparent; box-shadow: inset 0 0 0 1.5px var(--rim); cursor: pointer; }

/* ---------- lobby: settings ---------- */
.settings { display: grid; gap: 16px; }
.settings .section-label { margin-bottom: 0; }
.setting { display: grid; gap: 8px; }
.setting-name { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel-2); }
.seg button { border: 0; border-radius: 10px; padding: 8px 4px; min-height: 46px; background: transparent; color: var(--haze); font-weight: 700; cursor: pointer; line-height: 1.15; }
.seg button small { display: block; font-size: 12px; font-weight: 400; opacity: 0.85; }
.seg button[aria-checked="true"] { background: var(--bulb); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 99px; padding: 8px 13px; min-height: 40px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--panel-2); color: var(--haze); box-shadow: inset 0 0 0 1.5px var(--rim); }
.chip[aria-pressed="true"] { background: rgba(255, 211, 92, 0.15); color: var(--bulb); box-shadow: inset 0 0 0 1.5px rgba(255, 211, 92, 0.6); }
.toggle { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; font-weight: 700; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-ui { position: relative; flex: none; width: 50px; height: 30px; border-radius: 99px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--rim); transition: background 0.15s; }
.toggle-ui::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--haze); transition: transform 0.15s, background 0.15s; }
.toggle input:checked + .toggle-ui { background: rgba(255, 211, 92, 0.22); box-shadow: inset 0 0 0 2px var(--bulb); }
.toggle input:checked + .toggle-ui::after { transform: translateX(20px); background: var(--bulb); }
.toggle input:focus-visible + .toggle-ui { outline: 3px solid var(--azure); outline-offset: 3px; }
.hint { margin: -6px 0 0; text-align: center; font-size: 14px; color: var(--haze); text-wrap: balance; }
.waiting { margin: 0; font-weight: 700; text-align: center; }
.summary { margin: 6px 0 0; text-align: center; color: var(--haze); font-size: 15px; }

/* ---------- question ---------- */
.q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.q-count { font-weight: 700; white-space: nowrap; }
.q-count span { color: var(--haze); font-weight: 400; }
.q-cat { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bulb); text-align: right; }
.dbl { align-self: flex-start; margin: -6px 0 -4px; font-family: var(--display); font-size: 21px; color: var(--tomato); transform: rotate(-2deg); }
.q-text { margin: 0; font-size: clamp(23px, 6.2vw, 32px); line-height: 1.22; font-weight: 700; text-wrap: balance; }
.q-text.small { font-size: clamp(19px, 5vw, 24px); }
.q-kind { margin: -8px 0 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--haze); }
.timer { display: flex; align-items: center; gap: 14px; }
.bulbrow { flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: center; }
.bulbrow i { justify-self: center; width: 100%; max-width: 16px; aspect-ratio: 1; border-radius: 50%; background: #29336E; transition: background 0.25s, box-shadow 0.25s; }
.bulbrow i.on { background: var(--bulb); box-shadow: 0 0 10px rgba(255, 211, 92, 0.55); }
.bulbrow i.on.warn { background: var(--tomato); box-shadow: 0 0 10px rgba(255, 94, 87, 0.65); }
.timer.urgent .bulbrow i.on { animation: blink 0.5s steps(1) infinite; }
.secs { min-width: 2.2ch; text-align: right; font-size: 30px; line-height: 1; }
[data-stage="timeup"] .secs, [data-stage="locked"] .secs { color: var(--haze); text-shadow: none; }
.answer-zone { position: relative; }
.ready { display: none; }
[data-stage="intro"] .ready { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
[data-stage="intro"] .opts, [data-stage="intro"] .numform { visibility: hidden; }
.ready-label { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--haze); }
.ready-num { font-size: 72px; line-height: 1; }
.opts { display: grid; gap: 10px; }
.opt {
  position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; min-height: 66px; padding: 10px 14px 10px 12px; border: 0; border-radius: 18px; text-align: left;
  font-size: 19px; font-weight: 700; line-height: 1.2; color: #fff; background: var(--tile); box-shadow: 0 5px 0 var(--tile-deep);
  cursor: pointer; transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s, filter 0.2s;
}

.opts.tf .opt { grid-template-columns: 1fr; justify-items: center; text-align: center; min-height: 104px; font-size: 22px; gap: 6px; }

.q-status { margin: 0; min-height: 1.45em; text-align: center; font-weight: 700; }

.num-input { font-family: var(--led); font-weight: 900; font-size: 42px; line-height: 1.1; text-align: center; letter-spacing: 0.06em; color: var(--bulb); padding: 10px 12px; }

.verdict.ok .verdict-title { color: var(--mint); text-shadow: 3px 3px 0 #0B5E43; }
.verdict.no .verdict-title, .verdict.miss .verdict-title { color: var(--tomato); text-shadow: 3px 3px 0 #6E1C1A; }
.verdict.meh .verdict-title { color: var(--bulb); text-shadow: 3px 3px 0 #6B4B0B; }
.verdict-sub { margin: 8px 0 0; font-weight: 700; text-wrap: balance; }
.revealed .opt { cursor: default; }
.revealed .opt.dim { opacity: 0.34; filter: saturate(0.5); }
.revealed .opt.mine.dim { opacity: 0.7; }
.revealed .opt.mine.dim .otext { text-decoration: line-through; text-decoration-thickness: 2px; }
.revealed .opt.correct { box-shadow: 0 0 0 4px var(--studio), 0 0 0 7px var(--mint), 0 0 30px rgba(63, 224, 162, 0.4); }
.ribbon { position: absolute; top: -10px; right: 14px; padding: 2px 9px; border-radius: 99px; background: var(--mint); color: var(--ink); font-size: 11px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; }
.pickers { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; }

.num-answer-value { display: block; margin-top: 4px; font-size: clamp(38px, 11vw, 58px); line-height: 1.1; }
.guesses { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; }

.step-name { font-weight: 700; overflow-wrap: anywhere; line-height: 1.2; }

.step-1 .step-block { height: 120px; background: var(--bulb); box-shadow: 0 0 34px rgba(255, 211, 92, 0.35); }

.awards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.awards li { display: flex; align-items: center; gap: 12px; }
.award-title { display: block; font-weight: 700; }
.award-who { display: block; color: var(--haze); font-size: 15px; }

/* ---------- sheet, toast, confetti ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 16px; background: rgba(5, 8, 24, 0.62); }
.sheet[hidden] { display: none; }
.sheet-card { width: 100%; max-width: 480px; display: grid; gap: 12px; padding: 20px; border-radius: 22px; background: var(--panel); box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4), inset 0 0 0 1.5px var(--rim); animation: rise 0.22s ease-out both; }

.how summary { cursor: pointer; font-weight: 700; color: var(--haze); padding: 6px 0; }

.lamp-dot[data-state="part"] { background: #FFC23D; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 99px; background: var(--chalk); color: var(--ink); font-weight: 700; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); opacity: 0; transform: translate(-50%, 20px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }

.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45; pointer-events: none; }

@media (min-width: 720px) {

/* ---- relay.js ---- */
/* ===================================================================
   Relay layer: a tiny MQTT 3.1.1 client over WebSocket (QoS 0 only),
   fanned out across several free public brokers at once so the game
   keeps working if one of them is down. Messages are end-to-end
   encrypted with a key derived from the room code.
   =================================================================== */
const DEFAULT_RELAYS = [
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://mqtt.eclipseprojects.io:443/mqtt"
];

const TXT_ENC = new TextEncoder();
const TXT_DEC = new TextDecoder();

function concatBytes(...parts) {
  let n = 0; for (const p of parts) n += p.length;
  const out = new Uint8Array(n); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function randomId(len = 12) {
  const abc = "abcdefghijkmnpqrstuvwxyz23456789";
  const r = crypto.getRandomValues(new Uint8Array(len));
  let s = ""; for (const b of r) s += abc[b % abc.length];
  return s;
}

const Mqtt = {
  str(s) { const b = TXT_ENC.encode(s); return concatBytes(new Uint8Array([b.length >> 8, b.length & 255]), b); },
  len(n) { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return new Uint8Array(out); },
  packet(first, body) { return concatBytes(new Uint8Array([first]), Mqtt.len(body.length), body); },
  connect(clientId, keepalive, username, password) {
    let flags = 0x02; // clean session
    const tail = [Mqtt.str(clientId)];
    if (username) { flags |= 0x80; tail.push(Mqtt.str(username)); if (password) { flags |= 0x40; tail.push(Mqtt.str(password)); } }
    const head = concatBytes(Mqtt.str("MQTT"), new Uint8Array([4, flags, keepalive >> 8, keepalive & 255]));
    return Mqtt.packet(0x10, concatBytes(head, ...tail));
  },
  subscribe(id, filters) {
    const parts = [new Uint8Array([id >> 8, id & 255])];
    for (const f of filters) parts.push(Mqtt.str(f), new Uint8Array([0]));
    return Mqtt.packet(0x82, concatBytes(...parts));
  },
  unsubscribe(id, filters) {
    return Mqtt.packet(0xA2, concatBytes(new Uint8Array([id >> 8, id & 255]), ...filters.map(Mqtt.str)));
  },
  publish(topic, payload, retain) { return Mqtt.packet(0x30 | (retain ? 1 : 0), concatBytes(Mqtt.str(topic), payload)); },
  PINGREQ: new Uint8Array([0xC0, 0]),
  DISCONNECT: new Uint8Array([0xE0, 0])
};

/* One connection to one broker, reconnecting forever with backoff. */
class MqttLink {
  constructor(url, onMessage, onStatus) {
    const u = new URL(url);
    this.username = decodeURIComponent(u.username || "");
    this.password = decodeURIComponent(u.password || "");
    u.username = ""; u.password = "";
    this.url = u.toString();
    this.host = u.hostname;
    this.onMessage = onMessage; this.onStatus = onStatus;
    this.subs = new Set();
    this.state = "idle";
    this.ws = null; this.buf = new Uint8Array(0);
    this.nextPid = 1; this.retry = 0; this.retryTimer = null; this.pinger = null;
    this.lastRx = 0; this.lastPing = 0; this.stopped = true;
    this.clientId = "cc" + randomId(16);
  }
  setState(s) { if (this.state !== s) { this.state = s; this.onStatus && this.onStatus(this); } }
  start() { if (!this.stopped) return; this.stopped = false; this.open(); }
  stop() {
    this.stopped = true; clearTimeout(this.retryTimer); clearInterval(this.pinger); this.pinger = null;
    const ws = this.ws; this.ws = null;
    if (ws) { ws.onclose = ws.onmessage = ws.onerror = null; try { if (this.state === "up") ws.send(Mqtt.DISCONNECT); ws.close(); } catch (e) {} }
    this.setState("idle");
  }
  open() {
    if (this.stopped || this.ws) return;
    clearTimeout(this.retryTimer);
    this.setState("connecting");
    let ws;
    try { ws = new WebSocket(this.url, ["mqtt"]); } catch (e) { this.scheduleRetry(); return; }
    ws.binaryType = "arraybuffer";
    this.ws = ws; this.buf = new Uint8Array(0);
    const giveUp = setTimeout(() => { if (this.ws === ws && this.state !== "up") this.drop(); }, 10000);
    ws.onopen = () => { if (this.ws === ws) this.raw(Mqtt.connect(this.clientId, 30, this.username, this.password)); };
    ws.onmessage = ev => { if (this.ws !== ws) return; this.lastRx = Date.now(); this.feed(new Uint8Array(ev.data)); };
    ws.onerror = () => {};
    ws.onclose = () => { clearTimeout(giveUp); if (this.ws === ws) { this.ws = null; this.scheduleRetry(); } };
  }
  drop() {
    const ws = this.ws; this.ws = null;
    if (ws) { ws.onclose = ws.onmessage = ws.onerror = null; try { ws.close(); } catch (e) {} }
    this.scheduleRetry();
  }
  scheduleRetry() {
    clearInterval(this.pinger); this.pinger = null;
    if (this.stopped) { this.setState("idle"); return; }
    this.setState("down");
    const wait = Math.min(15000, 1000 * Math.pow(2, this.retry++)) * (0.7 + Math.random() * 0.6);
    clearTimeout(this.retryTimer);
    this.retryTimer = setTimeout(() => this.open(), wait);
  }
  /* Called when the page comes back to the foreground or the network returns. */
  nudge() {
    if (this.stopped) return;
    if (this.state === "down") { this.retry = 0; clearTimeout(this.retryTimer); this.open(); }
    else if (this.state === "up") this.ping();
  }
  raw(bytes) {
    if (!this.ws || this.ws.readyState !== 1) return false;
    try { this.ws.send(bytes); return true; } catch (e) { return false; }
  }
  ping() { this.lastPing = Date.now(); this.raw(Mqtt.PINGREQ); }
  startPinger() {
    clearInterval(this.pinger);
    this.pinger = setInterval(() => {
      if (this.state !== "up") return;
      const now = Date.now();
      if (this.lastRx < this.lastPing && now - this.lastPing > 6000) { this.drop(); return; } // no answer: dead socket
      if (now - Math.max(this.lastPing, this.lastRx) > 15000) this.ping();
    }, 2000);
  }
  pid() { const id = this.nextPid; this.nextPid = this.nextPid >= 65535 ? 1 : this.nextPid + 1; return id; }
  subscribe(filter) { if (this.subs.has(filter)) return; this.subs.add(filter); if (this.state === "up") this.raw(Mqtt.subscribe(this.pid(), [filter])); }
  unsubscribe(filter) { if (!this.subs.delete(filter)) return; if (this.state === "up") this.raw(Mqtt.unsubscribe(this.pid(), [filter])); }
  publish(topic, payload, retain) { return this.state === "up" && this.raw(Mqtt.publish(topic, payload, retain)); }
  feed(chunk) {
    const b = this.buf.length ? concatBytes(this.buf, chunk) : chunk;
    let off = 0;
    for (;;) {
      if (b.length - off < 2) break;
      let i = off + 1, len = 0, mult = 1, byte, complete = false;
      for (let k = 0; k < 4 && i < b.length; k++) {
        byte = b[i++]; len += (byte & 127) * mult; mult *= 128;
        if (!(byte & 128)) { complete = true; break; }
      }
      if (!complete) { if (i - off > 4) { this.drop(); return; } break; }
      if (b.length - i < len) break;
      const type = b[off] >> 4, flags = b[off] & 15, body = b.subarray(i, i + len);
      off = i + len;
      this.handle(type, flags, body);
      if (!this.ws) return;
    }
    this.buf = off < b.length ? b.slice(off) : new Uint8Array(0);
  }
  handle(type, flags, body) {
    if (type === 2) { // CONNACK
      if (body.length >= 2 && body[1] === 0) {
        this.retry = 0; this.lastPing = Date.now(); this.setState("up"); this.startPinger();
        if (this.subs.size) this.raw(Mqtt.subscribe(this.pid(), [...this.subs]));
      } else this.drop();
    } else if (type === 3) { // PUBLISH
      if (body.length < 2) return;
      const tlen = (body[0] << 8) | body[1];
      const topic = TXT_DEC.decode(body.subarray(2, 2 + tlen));
      let p = 2 + tlen; const qos = (flags >> 1) & 3;
      if (qos > 0) {
        const hi = body[p], lo = body[p + 1]; p += 2;
        this.raw(new Uint8Array([qos === 1 ? 0x40 : 0x50, 2, hi, lo])); // PUBACK / PUBREC
      }
      try { this.onMessage(topic, body.slice(p), !!(flags & 1), this); } catch (e) { console.error(e); }
    } else if (type === 6) { // PUBREL -> PUBCOMP
      if (body.length >= 2) this.raw(new Uint8Array([0x70, 2, body[0], body[1]]));
    }
    // SUBACK (9), UNSUBACK (11), PINGRESP (13): nothing to do — lastRx already updated.
  }
}

/* All brokers together. Publishes go to every connected broker; the
   channel above de-duplicates what comes back. */
class Relay {
  constructor(urls, onMessage) {
    this.listeners = new Set();
    this.links = urls.map(u => new MqttLink(u, onMessage, () => this.listeners.forEach(fn => fn(this.status()))));
    this.nudge = () => this.links.forEach(l => l.nudge());
    this.onVisible = () => { if (document.visibilityState === "visible") this.nudge(); };
  }
  start() {
    this.links.forEach(l => l.start());
    window.addEventListener("online", this.nudge);
    window.addEventListener("focus", this.nudge);
    document.addEventListener("visibilitychange", this.onVisible);
  }
  stop() {
    this.links.forEach(l => l.stop());
    window.removeEventListener("online", this.nudge);
    window.removeEventListener("focus", this.nudge);
    document.removeEventListener("visibilitychange", this.onVisible);
  }
  subscribe(f) { this.links.forEach(l => l.subscribe(f)); }
  unsubscribe(f) { this.links.forEach(l => l.unsubscribe(f)); }
  publish(topic, payload, retain = false) { let n = 0; for (const l of this.links) if (l.publish(topic, payload, retain)) n++; return n; }
  status() { return { up: this.links.filter(l => l.state === "up").length, total: this.links.length, links: this.links.map(l => ({ host: l.host, state: l.state })) }; }
  onStatus(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
}

/* Room crypto: the 4-letter code is turned into a topic name and an
   AES-GCM key, so the public relays only ever see scrambled bytes. */
const RoomCrypto = {
  async sha256(text) { return new Uint8Array(await crypto.subtle.digest("SHA-256", TXT_ENC.encode(text))); },
  hex(bytes) { let s = ""; for (const b of bytes) s += b.toString(16).padStart(2, "0"); return s; },
  async derive(code) {
    const c = code.toUpperCase();
    const topic = RoomCrypto.hex(await RoomCrypto.sha256("clever-clogs/v1/topic/" + c)).slice(0, 24);
    const raw = await RoomCrypto.sha256("clever-clogs/v1/key/" + c);
    const key = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
    return { topic, key };
  },
  async seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, TXT_ENC.encode(JSON.stringify(obj))));
    return concatBytes(new Uint8Array([1]), iv, ct);
  },
  async open(key, data) {
    if (!data || data.length < 30 || data[0] !== 1) return null;
    try {
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.subarray(1, 13) }, key, data.subarray(13));
      return JSON.parse(TXT_DEC.decode(pt));
    } catch (e) { return null; }
  }
};

/* A room: topic base + key + de-duplication + typed handlers.
   Sub-topics: s = game state (retained, from the host),
               a = actions (players -> host), r = reactions (everyone). */
class Channel {
  constructor(relay, code) {
    this.relay = relay; this.code = code.toUpperCase();
    this.base = null; this.key = null; this.handlers = {}; this.seen = new Map(); this.subs = [];
  }
  async open(subTopics) {
    const { topic, key } = await RoomCrypto.derive(this.code);
    this.base = "clevclogs/v1/" + topic; this.key = key;
    for (const s of subTopics) { const f = this.base + "/" + s; this.subs.push(f); this.relay.subscribe(f); }
    return this;
  }
  close() { for (const f of this.subs) this.relay.unsubscribe(f); this.subs = []; this.handlers = {}; }
  on(sub, fn) { this.handlers[sub] = fn; }
  owns(topic) { return this.base && topic.startsWith(this.base + "/"); }
  async deliver(topic, bytes, retained) {
    if (!this.owns(topic) || !bytes.length) return;
    const msg = await RoomCrypto.open(this.key, bytes);
    if (!msg || typeof msg !== "object" || typeof msg.i !== "string") return;
    const sub = topic.slice(this.base.length + 1);
    const now = Date.now();
    if (this.seen.has(msg.i)) return;
    this.seen.set(msg.i, now);
    if (this.seen.size > 600) for (const [k, t] of this.seen) { if (now - t > 120000 || this.seen.size > 400) this.seen.delete(k); else break; }
    const fn = this.handlers[sub]; if (fn) fn(msg, retained);
  }
  async send(sub, obj, retain = false) {
    if (!this.key) return 0;
    const msg = Object.assign({ i: randomId(12) }, obj);
    const bytes = await RoomCrypto.seal(this.key, msg);
    return this.relay.publish(this.base + "/" + sub, bytes, retain);
  }
  clearRetained(sub) { if (this.base) this.relay.publish(this.base + "/" + sub, new Uint8Array(0), true); }
}

/* ---- engine.js ---- */
/* ===================================================================
   Game engine. The host's device runs this; everyone else just
   renders the public state it broadcasts. Pure logic, no DOM.
   =================================================================== */
const RULES = {
  counts: [10, 15, 20],
  timers: [30, 20, 12],           // seconds for a normal question
  numberBonusSecs: 10,            // extra time to type a number
  graceMs: 1500,                  // late answers still accepted (network lag)
  earlyCloseMs: 700,              // pause after the last answer comes in
  onlineMs: 13000,                // no hello for this long = offline
  maxPlayers: 16,
  numPoints: [1000, 600, 300],
  numRest: 150,
  exactBonus: 200
};
const DEFAULT_SETTINGS = { count: 15, secs: 20, cats: Object.keys(CATEGORIES), easy: false, numbers: true };

function hashText(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}
QUESTION_BANK.forEach(q => { q.id = q.c + "-" + hashText(q.q + "|" + q.a); if (!q.t) q.t = "mc"; });

function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const answerKey = q => q.t === "tf" ? null : String(q.a).toLowerCase().replace(/^(the|a|an) /, "").trim();

/* Choose a balanced set: roughly 70% multiple choice, 15% true/false,
   15% nearest-number; spread across categories; avoid recently used
   questions and two questions sharing an answer; gentle difficulty ramp. */
function pickQuestions(settings, recent = [], rng = Math.random, bank = QUESTION_BANK) {
  const cats = new Set(settings.cats && settings.cats.length ? settings.cats : Object.keys(CATEGORIES));
  const pool = bank.filter(q => cats.has(q.c) && (!settings.easy || q.d <= 2) && (settings.numbers || q.t !== "num"));
  const N = Math.min(settings.count, pool.length);
  const recentAge = new Map(recent.map((id, i) => [id, i]));
  const usedAnswers = new Set(), picked = [], pickedIds = new Set();

  const take = (type, k) => {
    const groups = {};
    const cands = pool.filter(q => q.t === type && !pickedIds.has(q.id));
    const fresh = shuffle(cands.filter(q => !recentAge.has(q.id)), rng);
    const stale = cands.filter(q => recentAge.has(q.id)).sort((a, b) => recentAge.get(a.id) - recentAge.get(b.id));
    for (const q of [...fresh, ...stale]) (groups[q.c] = groups[q.c] || []).push(q);
    let got = 0;
    const order = shuffle(Object.keys(groups), rng);
    while (got < k && order.some(c => groups[c].length)) {
      for (const c of order) {
        if (got >= k) break;
        while (groups[c].length) {
          const q = groups[c].shift(), key = answerKey(q);
          if (key && usedAnswers.has(key)) continue;
          if (key) usedAnswers.add(key);
          picked.push(q); pickedIds.add(q.id); got++;
          break;
        }
      }
    }
    return got;
  };
  const wantNum = settings.numbers ? Math.max(1, Math.round(N * 0.15)) : 0;
  const wantTf = Math.max(1, Math.round(N * 0.15));
  take("num", wantNum);
  take("tf", wantTf);
  take("mc", N - picked.length);
  if (picked.length < N) take("tf", N - picked.length);
  if (picked.length < N) take("num", N - picked.length);

  // difficulty ramp with a little randomness, then break up category runs
  let list = picked.map(q => ({ q, k: q.d + rng() * 1.7 })).sort((a, b) => a.k - b.k).map(x => x.q);
  for (let i = 1; i < list.length; i++) {
    if (list[i].c === list[i - 1].c) {
      const j = list.findIndex((q, idx) => idx > i && q.c !== list[i - 1].c);
      if (j > 0) [list[i], list[j]] = [list[j], list[i]];
    }
  }
  // the final (double points) question shouldn't be a 50/50
  if (list.length > 2 && list[list.length - 1].t === "tf") {
    const j = list.map(q => q.t).lastIndexOf("mc");
    if (j >= 0) [list[j], list[list.length - 1]] = [list[list.length - 1], list[j]];
  }
  return list.map(q => makeInstance(q, rng));
}

function makeInstance(q, rng = Math.random) {
  const base = { id: q.id, c: q.c, t: q.t, d: q.d, text: q.q, f: q.f || "" };
  if (q.t === "mc") { const opts = shuffle([q.a, ...q.w], rng); return Object.assign(base, { opts, correct: opts.indexOf(q.a) }); }
  if (q.t === "tf") return Object.assign(base, { opts: ["True", "False"], correct: q.a ? 0 : 1 });
  return Object.assign(base, { u: q.u, correct: q.a });
}

const choicePoints = (ms, limit) => Math.round((1000 - 500 * Math.min(1, Math.max(0, ms / limit))) / 10) * 10;

/* Nearest-number scoring: rank by distance (ties share), 1000/600/300 then 150,
   +200 for bang on. Returns {pid: {pts, rank, exact, off}}. */
function numberResults(answers, target) {
  const rows = Object.entries(answers).map(([pid, a]) => ({ pid, off: Math.abs(a.v - target), v: a.v }));
  const offs = [...new Set(rows.map(r => r.off))].sort((a, b) => a - b);
  const out = {};
  for (const r of rows) {
    const rank = offs.indexOf(r.off) + 1;
    const exact = r.off === 0;
    const pts = (rank <= RULES.numPoints.length ? RULES.numPoints[rank - 1] : RULES.numRest) + (exact ? RULES.exactBonus : 0);
    out[r.pid] = { pts, rank, exact, off: r.off };
  }
  return out;
}

function introMsFor(text) { return Math.max(2600, Math.min(5000, 1800 + text.length * 28)); }

class HostGame {
  static create({ code, pid, name, av, now = Date.now() }) {
    const g = new HostGame();
    Object.assign(g, {
      v: 1, code, gid: randomId(8), rev: now, host: pid, phase: "lobby", round: 1,
      settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
      players: {}, order: [], kicked: [], qs: [], qi: -1, cur: null, results: [], fin: null, onlineSig: ""
    });
    g.hello(pid, name, av, now);
    return g;
  }
  static restore(json) { const g = new HostGame(); Object.assign(g, json); return g; }
  toJSON() { const o = {}; for (const k of Object.keys(this)) o[k] = this[k]; return o; }
  bump(now = Date.now()) { this.rev = Math.max(this.rev + 1, now); return true; }

  isOnline(p, now) { return p.pid === this.host || now - p.lastSeen < RULES.onlineMs; }
  hello(pid, name, av, now = Date.now()) {

  applyState(msg);
}
function onReaction(msg) {
  if (msg.k !== "react" || typeof msg.p !== "string" || msg.p === S.pid) return;
  const e = REACTIONS[msg.e]; if (!e) return;
  floatEmoji(e, player(msg.p));
}

/* Both roles: take a public state, sync local timers, play cues, render. */
function applyState(s) {
  const prev = S.room;
  S.room = s;
  const t = performance.now();
  if (s.phase === "question" && s.q) {
    S.seenQs.add(s.q.id);
    if (S.local.qid !== s.q.id) {
      const saved = Store.get("answer");
      S.local = { qid: s.q.id, openAt: t + s.q.intro, deadline: t + s.q.left, answer: saved && saved.qid === s.q.id ? saved : null, stage: "", lastSecs: -1, sentAt: 0 };
    } else {
      S.local.openAt = Math.min(S.local.openAt, t + s.q.intro);
      S.local.deadline = Math.min(S.local.deadline, t + s.q.left);
    }
  }
  if (S.ui.screen === "connecting" && S.role === "player") S.ui.screen = "game";
  // cues
  const cueKey = s.phase + ":" + (s.q ? s.q.id : "") + ":" + s.round;
  if (S.soundedFor !== cueKey && prev) {
    S.soundedFor = cueKey;
    if (s.phase === "reveal" && s.res) { const p = s.res.picks[S.pid]; Sound.play(p ? (p.ok ? "right" : "wrong") : "wrong"); }
    if (s.phase === "final") { Sound.play("fanfare"); setTimeout(confetti, 250); }
  } else if (!prev) S.soundedFor = cueKey;
  if (s.phase === "lobby") {
    const ids = s.players.map(p => p.id).join(",");
    if (S.knownPlayers !== null && ids.length > S.knownPlayers.length) Sound.play("pop");
    S.knownPlayers = ids;
  }
  render();
}
function submitAnswer(v) {
  const r = S.room; if (!r || r.phase !== "question" || !r.q || S.local.answer) return;
  const now = performance.now();
  if (now < S.local.openAt - 50 || now > S.local.deadline + 300) return;
  const ms = Math.round(Math.min(r.q.limit, Math.max(0, now - S.local.openAt)));
  S.local.answer = { qid: r.q.id, v, ms };
  Store.set("answer", S.local.answer);
  Sound.play("lock");
  if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
  if (S.role === "host") { if (S.host.answer(S.pid, r.q.id, v, ms, Date.now())) hostChanged(); }
  else sendAnswer();
  patch();
}
function sendAnswer() {
  const a = S.local.answer, r = S.room;
  if (!a || !r || r.phase !== "question" || !r.q || r.q.id !== a.qid) return;
  const mine = me(); if (mine && mine.ans) return;
  S.local.sentAt = Date.now();
  S.channel.send("a", { k: "ans", p: S.pid, n: S.profile.name, av: S.profile.av, q: a.qid, v: a.v, ms: a.ms });
}

/* ---------------- the 10 Hz loop ---------------- */
function loop() {
  const now = Date.now();
  const gap = S.lastLoop ? now - S.lastLoop : 0; S.lastLoop = now;
  if (S.role === "host" && S.host && S.channel) {
    if (gap > 2500 && S.host.phase === "question" && S.host.cur) { S.host.cur.deadline = Math.max(S.host.cur.deadline, now + 2500 - RULES.graceMs); S.host.cur.allInAt = null; publishNow(); }
    if (S.host.tick(now)) hostChanged();
    else if (now - S.lastPublish > 3000) publishNow();
  } else if (S.role === "player" && S.channel) {
    if (now - S.lastHello > 4000) sendHello();
    if (S.local.answer && now - S.local.sentAt > 1500) sendAnswer();
  }
  if (S.ui.screen === "game" || S.ui.screen === "connecting") patchLive();
}

/* ---------------- rendering ---------------- */
function screenKey() {
  const u = S.ui, r = S.room;

}
function render() {
  const main = $("#app"); if (!main) return;

    S.ui.key = key;
    main.innerHTML = view();

}
function view() {

}

  const r = S.room;
  const lamp = $("#lamp");
  if (lamp) { const st = S.relayStatus; lamp.dataset.state = st.up === 0 ? "bad" : st.up < st.total ? "part" : "good"; lamp.setAttribute("aria-label", `Menu. Connected to ${st.up} of ${st.total} game servers`); }
  if (!r || S.ui.screen !== "game") return;
  const m = me();
  const gs = $("#gscore"); if (gs) gs.textContent = fmt(m ? m.score : 0);
  const gm = $("#gmid"); if (gm) gm.textContent = r.phase === "lobby" ? (S.role === "host" ? "You’re the host" : "In the lobby") : r.phase === "final" ? "Final scores" : placeText(r);
  if (r.phase === "lobby") patchLobby(r);
  if (r.phase === "question") patchQuestion(r);
  if (r.phase === "reveal") { const st = $("#standings"); if (st) setHTML(st, standingsHTML(r, true)); const hn = $("#hostname"); if (hn) hn.textContent = hostName(); }
  patchBanner();
}
function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function placeText(r) {
  const mine = me(); if (!mine || r.players.length < 2) return r.q ? `Question ${r.q.n}` : "";
  const ahead = r.players.filter(p => p.score > mine.score).length, tied = r.players.filter(p => p.score === mine.score).length > 1;
  return (tied ? "Joint " : "") + ordinal(ahead + 1) + " place";
}
function setHTML(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }
function patchLobby(r) {
  const list = $("#players");
  if (list) setHTML(list, r.players.map(p => `<li class="player ${p.on ? "" : "away"}">${avatar(p)}<span class="pname">${esc(p.name)}</span>
    ${p.id === r.host ? `<span class="tag">Host</span>` : ""}${p.id === S.pid ? `<span class="tag you">You</span>` : ""}${p.on ? "" : `<span class="away-note">away</span>`}
    ${S.role === "host" && p.id !== S.pid ? `<button class="kick" data-act="kick" data-pid="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">Remove</button>` : ""}</li>`).join(""));
  const pc = $("#pcount"); if (pc) pc.textContent = r.players.length;
  const st = r.settings;
  document.querySelectorAll("[data-act=set]").forEach(b => b.setAttribute("aria-checked", String(st[b.dataset.key] === Number(b.dataset.val))));
  document.querySelectorAll("[data-act=cat]").forEach(b => b.setAttribute("aria-pressed", String(st.cats.includes(b.dataset.cat))));
  const easy = $("#opt-easy"); if (easy) easy.checked = !!st.easy;
  const nums = $("#opt-numbers"); if (nums) nums.checked = !!st.numbers;
  const wait = $("#lobby-wait"); if (wait) wait.textContent = me() ? `You’re in! Waiting for ${hostName()} to start the quiz.` : "Joining…";
  const sum = $("#lobby-summary"); if (sum) sum.textContent = `${st.count} questions · ${st.secs} seconds each · ${st.cats.length === Object.keys(CATEGORIES).length ? "all categories" : st.cats.map(c => CATEGORIES[c]).join(", ")}`;
}
function patchQuestion(r) {
  const list = $("#answered");
  if (list) setHTML(list, r.players.filter(p => p.on || p.ans).map(p => `<li class="${p.ans ? "done" : ""}" title="${esc(p.name)}${p.ans ? " has answered" : ""}">${avatar(p, "mini")}<span class="tick" aria-hidden="true">✓</span><span class="sr">${esc(p.name)} ${p.ans ? "has answered" : "is thinking"}</span></li>`).join(""));
  patchLive();
}
function patchLive() {
  const r = S.room;
  if (S.ui.screen === "connecting") { const help = $("#conn-help"); if (help && S.ui.mode === "join" && Date.now() - S.joinAt > 7000) help.hidden = false; return; }
  if (!r || r.phase !== "question" || !r.q) return;
  const qs = $("#qscreen"); if (!qs) return;
  const now = performance.now(), L = S.local, q = r.q;
  const mine = me();
  const answered = !!L.answer || (mine && mine.ans);
  let stage = now < L.openAt ? "intro" : answered ? "locked" : now > L.deadline ? "timeup" : "open";
  if (qs.dataset.stage !== stage) {
    const before = qs.dataset.stage; qs.dataset.stage = stage;
    if (stage === "open" && before === "intro") { Sound.play("go"); const n = $("#numv"); if (n && !("ontouchstart" in window)) n.focus({ preventScroll: true }); }
    const status = $("#qstatus");
    if (status) status.textContent = stage === "locked" ? "Locked in! Waiting for everyone else…" : stage === "timeup" ? "Time’s up!" : "";
    document.querySelectorAll("#opts .opt").forEach(b => { b.disabled = stage !== "open"; });
    const ng = $("#numgo"), nv = $("#numv"); if (ng) ng.disabled = stage !== "open"; if (nv) nv.disabled = stage !== "open";
  }
  if (stage === "locked" && L.answer) {
    document.querySelectorAll("#opts .opt").forEach(b => { const on = Number(b.dataset.i) === L.answer.v; b.classList.toggle("picked", on); b.setAttribute("aria-pressed", String(on)); });
    const nv = $("#numv"); if (nv && q.t === "num" && document.activeElement !== nv) nv.value = String(L.answer.v);
  }
  const readyNum = $("#ready-num"); if (readyNum) readyNum.textContent = Math.max(1, Math.ceil((L.openAt - now) / 1000));
  const left = Math.max(0, L.deadline - Math.max(now, L.openAt)), frac = Math.min(1, left / q.limit);
  const secs = Math.ceil(left / 1000);
  const secsEl = $("#secs"); if (secsEl) secsEl.textContent = stage === "intro" ? Math.round(q.limit / 1000) : secs;
  const bulbs = qs.querySelectorAll(".bulbrow i"), lit = Math.ceil(frac * bulbs.length);
  bulbs.forEach((b, i) => { b.className = i < lit ? (frac <= 0.25 ? "on warn" : "on") : ""; });
  const timer = $("#timer"); if (timer) timer.classList.toggle("urgent", stage === "open" && secs <= 5);
  if (stage === "open" && secs <= 5 && secs !== L.lastSecs && secs > 0) Sound.play("tick");
  L.lastSecs = secs;
}
function patchBanner() {
  const b = $("#banner"); if (!b) return;
  let msg = "";
  if (S.relay && S.relayStatus.up === 0) msg = "Reconnecting to the game…";
  else if (S.role === "player" && S.lastStateAt && Date.now() - S.lastStateAt > 10000) msg = `Waiting for ${hostName()}’s phone to reconnect…`;
  b.hidden = !msg; if (msg) b.textContent = msg;
}
setInterval(() => { if (S.ui.screen === "game") patchBanner(); }, 1000);

/* ---------------- interactions ---------------- */
function onClick(e) {
  const el = e.target.closest("[data-act]"); if (!el) { if (e.target.id === "sheet") closeSheet(); return; }
  const act = el.dataset.act;
  Sound.unlock();
  switch (act) {
    case "to-host": ensureRelay(); return go("setup", { mode: "host" });
    case "to-join": ensureRelay(); return go("setup", { mode: "join" });
    case "home": closeSheet(); return go("home");
    case "resume": return resume();
    case "forget": forgetSession(); return go("home");
    case "av": S.profile.av = Number(el.dataset.i); Store.set("profile", S.profile); document.querySelectorAll(".av-pick").forEach(b => b.setAttribute("aria-checked", String(b === el))); return;
    case "cancel": if (S.channel) S.channel.close(); S.channel = null; S.role = null; forgetSession(); return go("setup", { mode: S.ui.mode === "host" ? "host" : "join" });
    case "pick": return submitAnswer(Number(el.dataset.i));
    case "share": return shareInvite();
    case "copy": return copyInvite();
    case "set": if (S.host && S.host.updateSettings({ [el.dataset.key]: Number(el.dataset.val) })) hostChanged(); return;
    case "cat": {
      if (!S.host) return;
      const k = el.dataset.cat, cur = S.host.settings.cats;
      const next = cur.includes(k) ? cur.filter(c => c !== k) : [...cur, k];
      if (!next.length) return toast("Keep at least one category.");
      if (S.host.updateSettings({ cats: next })) hostChanged(); return;
    }
    case "cats-all": if (S.host && S.host.updateSettings({ cats: Object.keys(CATEGORIES) })) hostChanged(); return;
    case "opt": if (S.host && S.host.updateSettings({ [el.dataset.key]: el.checked })) hostChanged(); return;
    case "start": return hostStart();
    case "next": if (S.host && S.host.next(Date.now())) hostChanged(); return;
    case "again": if (S.host && S.host.playAgain(Date.now())) hostChanged(); return;
    case "kick": {
      const p = player(el.dataset.pid); if (!p) return;
      return confirmSheet(`Remove ${p.name}?`, "They’ll drop out of this room.", "Remove", () => { if (S.host.kick(p.id, Date.now())) { hostChanged(); toast(`${p.name} removed`); } });
    }
    case "react": return sendReaction(Number(el.dataset.i));
    case "menu": return openMenu();
    case "sheet-close": return closeSheet();
    case "sound": Sound.toggle(); return openMenu();
    case "skip": closeSheet(); if (S.host && S.host.skip(Date.now())) hostChanged(); return;
    case "end-now": return confirmSheet("End the quiz now?", "Everyone goes straight to the final scores.", "End the quiz", () => { if (S.host.endEarly(Date.now())) hostChanged(); });
    case "close-room": return confirmSheet("Close the room?", "This ends the game on everyone’s phone.", "Close the room", closeRoom);
    case "leave": return confirmSheet("Leave the game?", "You can rejoin with the same code while it’s still going.", "Leave", () => leaveRoom("leave"));
    case "confirm-yes": { const fn = S.ui.onConfirm; closeSheet(); if (fn) fn(); return; }
  }
}
function onSubmit(e) {
  e.preventDefault();
  Sound.unlock();
  if (e.target.id === "setup-form") return S.ui.mode === "join" ? joinGame() : startHosting();
  if (e.target.id === "numform") {
    const raw = ($("#numv").value || "").replace(/[\s,]/g, "");
    if (!/^\d{1,9}(\.\d+)?$/.test(raw)) { toast("Type a number first."); return; }
    submitAnswer(Number(raw));
  }
}
function onInput(e) {
  if (e.target.id === "code") { const v = e.target.value.replace(/[^a-z]/gi, "").toUpperCase().slice(0, 4); if (e.target.value !== v) e.target.value = v; S.ui.code = v; }
  if (e.target.id === "numv") { const v = e.target.value.replace(/[^\d]/g, "").slice(0, 9); if (e.target.value !== v) e.target.value = v; }
  if (e.target.id === "name" || e.target.id === "code") { const er = $("#form-error"); if (er && !er.hidden) er.hidden = true; }
}
async function shareInvite() {
  if (!S.code) return;
  if (location.protocol === "file:") return toast("Invites need the game online — see the README. Room code: " + S.code);
  const url = inviteUrl(S.code);
  const data = { title: "Clever Clogs", text: `Come and play our family quiz! Room code ${S.code}`, url };
  if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  copyInvite();
}
async function copyInvite() {
  if (location.protocol === "file:") return toast("Invites need the game online — see the README. Room code: " + S.code);
  const url = inviteUrl(S.code);
  try { await navigator.clipboard.writeText(url); toast("Invite link copied"); }
  catch (e) { toast("Room code: " + S.code); }
}
let lastReact = 0;
function sendReaction(i) {
  const now = Date.now(); if (now - lastReact < 600 || !REACTIONS[i]) return; lastReact = now;
  floatEmoji(REACTIONS[i], me());
  if (S.channel) S.channel.send("r", { k: "react", p: S.pid, e: i });
}
function closeRoom() {
  if (!S.host) return;
  S.host.close(Date.now());
  publishNow();
  const ch = S.channel;
  setTimeout(() => { if (ch) ch.clearRetained("s"); }, 1500);
  setTimeout(() => { if (ch) ch.close(); }, 2500);
  S.channel = null;
  forgetSession();
  S.role = null; S.host = null; S.room = null; keepAwake(false);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  go("home");
  toast("Room closed — thanks for playing!");
}

/* ---------------- sheets, toasts, effects ---------------- */
function openMenu() {
  const r = S.room, hosting = S.role === "host", st = S.relayStatus;
  const items = [];
  items.push(`<button class="sheet-item" data-act="sound">${Sound.on ? "Turn sound off" : "Turn sound on"}</button>`);
  if (S.code) items.push(`<button class="sheet-item" data-act="share">Share the invite again</button>`);
  if (hosting && r && r.phase === "question") items.push(`<button class="sheet-item" data-act="skip">Skip this question</button>`);
  if (hosting && r && (r.phase === "question" || r.phase === "reveal")) items.push(`<button class="sheet-item" data-act="end-now">End the quiz now</button>`);
  if (hosting) items.push(`<button class="sheet-item danger" data-act="close-room">Close the room for everyone</button>`);
  else if (S.role === "player") items.push(`<button class="sheet-item danger" data-act="leave">Leave the game</button>`);
  openSheet(`<h2 class="sheet-title" id="sheet-title">Menu</h2>
    <div class="sheet-list">${items.join("")}</div>
    <details class="how"><summary>How scoring works</summary>
      <p>Right answers score up to 1,000 — the quicker you are, the more you get (never less than 500). For “nearest number” questions the closest guess gets 1,000, then 600 and 300, with a 200 bonus for being bang on. The final question counts double.</p></details>
    <p class="net-line"><span class="lamp-dot" data-state="${st.up === 0 ? "bad" : st.up < st.total ? "part" : "good"}"></span>Connected to ${st.up} of ${st.total} game servers</p>
    <button class="btn btn-ghost" data-act="sheet-close">Close</button>`);
}
function confirmSheet(title, body, yes, fn) {
  S.ui.onConfirm = fn;
  openSheet(`<h2 class="sheet-title" id="sheet-title">${esc(title)}</h2><p class="sheet-body">${esc(body)}</p>
    <div class="actions"><button class="btn btn-danger" data-act="confirm-yes">${esc(yes)}</button><button class="btn btn-ghost" data-act="sheet-close">Cancel</button></div>`);
}
function openSheet(html) {
  let sh = $("#sheet");
  if (!sh) { sh = document.createElement("div"); sh.id = "sheet"; sh.className = "sheet"; document.body.appendChild(sh); }
  sh.innerHTML = `<div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${html}</div>`;
  sh.hidden = false; S.ui.sheet = true;
  const first = sh.querySelector("button"); if (first) first.focus({ preventScroll: true });
}
function closeSheet() { const sh = $("#sheet"); if (sh) sh.hidden = true; S.ui.sheet = null; S.ui.onConfirm = null; }
let toastTimer = null;
function toast(msg) {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function floatEmoji(e, p) {
  const el = document.createElement("div");
  el.className = "float-emoji";
  el.innerHTML = `<span class="fe-emoji">${e}</span>${p ? `<span class="fe-name">${esc(p.name)}</span>` : ""}`;
  el.style.left = (12 + Math.random() * 70) + "%";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), reducedMotion() ? 1500 : 2600);
}
function confetti() {
  if (reducedMotion()) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const cols = ["#FFD35C", "#FF5E57", "#3B9CFF", "#B479FF", "#3FE0A2", "#F6F3FF"];
  const bits = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: -Math.random() * H * 0.6, w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 10) * dpr, vx: (Math.random() - 0.5) * 2.4 * dpr, vy: (2.2 + Math.random() * 3.2) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.25, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const b of bits) { b.x += b.vx; b.y += b.vy; b.r += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore(); }
    if (t - t0 < 4200) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
function buildBulbs(sign) {
  const box = sign.querySelector(".bulbs"); if (!box || box.childElementCount) return;
  const perSide = sign.classList.contains("small") ? [9, 4] : [11, 6];
  const pts = [];
  for (let i = 0; i < perSide[0]; i++) pts.push([(i + 0.5) / perSide[0] * 100, 0]);
  for (let i = 0; i < perSide[1]; i++) pts.push([100, (i + 0.5) / perSide[1] * 100]);
  for (let i = perSide[0] - 1; i >= 0; i--) pts.push([(i + 0.5) / perSide[0] * 100, 100]);
  for (let i = perSide[1] - 1; i >= 0; i--) pts.push([0, (i + 0.5) / perSide[1] * 100]);
  box.innerHTML = pts.map(([x, y], i) => `<i style="left:${x}%;top:${y}%;animation-delay:${-(i % 3) * 0.4}s"></i>`).join("");
}
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && document.visibilityState === "visible") { if (!S.wake) { S.wake = await navigator.wakeLock.request("screen"); S.wake.addEventListener("release", () => { S.wake = null; }); } }
    else if (!on && S.wake) { await S.wake.release(); S.wake = null; }
  } catch (e) { S.wake = null; }
}

if (typeof window !== "undefined" && typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
}

</script>
</body>
